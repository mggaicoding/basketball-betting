# Local backing services for the training demos.
#
#   docker compose up -d              start PostgreSQL and Solace
#   docker compose up -d postgres     Module 3 only (Flyway / JDBC demos)
#   docker compose up -d solace       Module 2 only (BetPlaced broker demos)
#   docker compose down               stop and remove (state is intentionally ephemeral)
#
# Host ports are chosen so nothing collides with the training processes:
#   8080  Spring Boot API            (./gradlew bootRun)
#   8091  prepared Odds service      (./gradlew runDemoDownstreams)
#   8092  prepared Risk service      (./gradlew runDemoDownstreams)
services:
  postgres:
    image: postgres:17-alpine
    container_name: betting-postgres
    environment:
      POSTGRES_DB: betting
      POSTGRES_USER: betting
      POSTGRES_PASSWORD: betting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betting"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Solace PubSub+ Standard, single-node broker for the BetPlaced topic/queue demos.
  # The `solace` Spring profile connects to tcp://localhost:55555 with msgVpn/user/password
  # all defaulting to "default", which this image provides out of the box.
  solace:
    image: solace/solace-pubsub-standard:10.25.0
    container_name: betting-solace
    hostname: betting-solace
    # Required by the broker; it refuses to start with the 64m Docker default.
    shm_size: 1g
    ulimits:
      core: -1
      memlock: -1
      # SolOS 10.x aborts startup unless the nofile hard limit is 1048576
      # ("POST Violation [022]: Required system resource missing").
      nofile:
        soft: 2448
        hard: 1048576
    environment:
      # Credentials for the PubSub+ Manager UI and the SEMP API (not for messaging).
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
      # Smallest documented scaling tier: 1 core / 2 GiB instead of 2 cores / 4 GiB.
      system_scaling_maxconnectioncount: "100"
    ports:
      - "8088:8080"    # PubSub+ Manager + SEMP v2  -> http://localhost:8088 (admin/admin)
      - "55555:55555"  # SMF: the port the Spring Cloud Stream binder connects to
      # Colima/Lima does not forward guest ports inside the ephemeral range
      # (32768-60999), so 55555 is silently unreachable there. This second mapping
      # of the same SMF port is below that range and works on every runtime:
      #   SOLACE_HOST=tcp://localhost:15555 ./gradlew bootRun --args=...
      - "15555:55555"
      - "8008:8008"    # Web Messaging (WebSocket), handy for browser-based inspection
    healthcheck:
      # SEMP answers only after the message backbone is up, so this gates `depends_on`.
      test:
        - CMD-SHELL
        - curl -sf -u admin:admin http://localhost:8080/SEMP/v2/monitor/about || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
