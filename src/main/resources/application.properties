spring.application.name=basketball-betting

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}|%level|%thread|%X{traceId:-}|%logger{40}|%msg%n

management.endpoints.web.exposure.include=health,info,metrics,prometheus

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

training.cors.allowed-origins=${TRAINING_CORS_ALLOWED_ORIGINS:http://localhost:8081}
training.clients.odds.base-url=${TRAINING_ODDS_BASE_URL:http://localhost:8091}
training.clients.risk.base-url=${TRAINING_RISK_BASE_URL:http://localhost:8092}
