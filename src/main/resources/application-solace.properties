spring.cloud.function.definition=notifyBetPlaced
spring.cloud.stream.bindings.betPlaced-out-0.destination=sportsbook/bet/placed/v2
spring.cloud.stream.bindings.notifyBetPlaced-in-0.destination=sportsbook/bet/placed/v2
spring.cloud.stream.bindings.notifyBetPlaced-in-0.group=notify-bet-placed

# The Solace binder reads its session settings from `solace.java.*`, not from
# `spring.cloud.stream.solace.binder.java.*`. With the wrong prefix these four values
# are silently ignored and the binder falls back to its own localhost:55555 default,
# so every SOLACE_* override below has no effect.
# compose.yaml publishes SMF on both 55555 and 15555. 15555 is the default because
# Colima/Lima silently refuses to forward guest ports in the ephemeral range
# (32768-60999), which makes 55555 unreachable there; 15555 works on every runtime.
solace.java.host=${SOLACE_HOST:tcp://localhost:15555}
solace.java.msg-vpn=${SOLACE_MSG_VPN:default}
solace.java.client-username=${SOLACE_USERNAME:default}
solace.java.client-password=${SOLACE_PASSWORD:default}
