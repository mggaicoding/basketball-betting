name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Three separate tasks on purpose: check does not include the last two, because
      # they are their own source sets and cost more to run.
      - name: Unit and API tests
        run: ./gradlew test

      # Testcontainers starts its own PostgreSQL; the runner already provides Docker.
      - name: Database boundary
        run: ./gradlew integrationTest

      # Consumer tests write the pacts, then the provider replays them. No broker and no
      # PactFlow credentials are involved.
      - name: Contracts
        run: ./gradlew contractTest

      - name: Package
        run: ./gradlew bootJar slimDist

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
